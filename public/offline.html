<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tidak ada koneksi · PFI-EAPS</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc; color: #0f172a;
      }
      .card { max-width: 26rem; text-align: center; }
      .badge {
        width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 20px; display: grid; place-items: center;
        background: linear-gradient(135deg, #6366f1, #0ea5e9); color: #fff; font-size: 28px;
      }
      h1 { font-size: 1.375rem; margin: 0 0 8px; }
      p { margin: 0 0 24px; line-height: 1.6; color: #475569; }
      button {
        appearance: none; border: 0; cursor: pointer; padding: 12px 22px; border-radius: 999px;
        background: #4f46e5; color: #fff; font-size: 1rem; font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1120; color: #e2e8f0; }
        p { color: #94a3b8; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">&#9888;</div>
      <h1>Kamu sedang offline</h1>
      <p>Halaman ini belum tersimpan di cache. Periksa koneksi internet lalu coba lagi.</p>
      <button onclick="location.reload()">Coba lagi</button>
    </div>
  </body>
</html>
